name: Gift Exchange (Admin Only)

on:
  workflow_dispatch:
    inputs:
      confirm_exchange:
        description: 'Type "MERRY CHRISTMAS" to confirm exchange'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_exchange == 'MERRY CHRISTMAS'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Pre-pull Docker Images
        run: |
          echo "Pre-warming Docker cache..."
          docker pull swift:5.8-slim &
          docker pull rust:slim &
          docker pull gcc:12 &
          docker pull eclipse-temurin:17-jdk &
          docker pull mcr.microsoft.com/dotnet/sdk:8.0 &
          docker pull zenika/kotlin:latest &
          docker pull python:3.13-slim &
          docker pull node:18-alpine &
          docker pull alpine:3.18 &
          docker pull golang:1.23-alpine &
          docker pull ruby:3.3-alpine &
          wait
          echo "All images prepared!"

      - name: Run Exchange Logic
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Starting the Great SantaCode Exchange..."
          python3 core/exchange.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "SantaCode Bot"
          git config --global user.email "bot@santacode.org"
          
          # 確保在正確的分支上
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          
          # 使用 -f 強制加入可能被忽略的檔案
          git add -f received_gifts/ final_issue_body.md
          git commit -m "🎄 Deliver gifts [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

      - name: Post Summary Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 core/post_issue.py